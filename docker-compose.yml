version: '3.8'

services:
  # Service Laravel/PHP/Apache
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: contact-app:v5
    container_name: laravel-app
    ports:
      - "8000:80"
    environment:
      - APP_NAME=ContactApp
      - APP_ENV=local
      - APP_DEBUG=true
      - APP_KEY=base64:vUuwZJTGLlfKP0ejBmLsiVRpqbL1VCapSWwRkU2N298=
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=laravel_db
      - DB_USERNAME=root
      - DB_PASSWORD=
    volumes:
      - ./storage:/var/www/html/storage
    depends_on:
      - db
    networks:
      - laravel-network

  # Service MySQL
  db:
    image: mysql:8.0
    container_name: laravel-mysql
    ports:
      - "3307:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=
      - MYSQL_ALLOW_EMPTY_PASSWORD=yes
      - MYSQL_DATABASE=laravel_db
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - laravel-network

networks:
  laravel-network:
    driver: bridge

volumes:
  mysql-data:
    driver: local
